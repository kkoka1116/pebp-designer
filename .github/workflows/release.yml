# Builds the downloadable PEBP Studio for macOS and Windows.
#
# - Pull requests that touch the code or the packaging, and manual runs: build, smoke-test on synthetic data,
#   and keep the zips as workflow artifacts (nothing is published).
# - A pushed tag v*: the same, then a DRAFT GitHub release with the zips, their checksums and the release
#   notes from docs/releases/<tag>.md. A person reviews the draft and publishes it by hand.
name: Build PEBP Studio

on:
  pull_request:
    paths: ["pebp_demo/**", "external/**", "docs/INSTALL.md", "docs/STUDIO_*.md", ".github/workflows/release.yml"]
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    name: Regression checks (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: pebp_demo } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pebp_demo/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Phase 0 regression suite
        run: python scripts/phase0_check.py
      - name: Studio server checks
        run: python scripts/studio_check.py

  build:
    name: Build (${{ matrix.label }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, label: macOS Apple silicon }
          - { os: macos-15-intel, label: macOS Intel }
          - { os: windows-latest, label: Windows x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults: { run: { working-directory: pebp_demo, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pebp_demo/requirements*.txt }
      - name: Install
        run: |
          pip install -r requirements.txt -r packaging/requirements-build.txt
          if [ "$RUNNER_OS" = "macOS" ]; then pip install -r requirements-app.txt; fi
      - name: Build and smoke-test
        run: python packaging/build.py
      - name: Studio checks against the built app
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then EXE="dist/PEBP Studio.app/Contents/MacOS/PEBP Studio";
          else EXE="dist/PEBP Studio/PEBP Studio.exe"; fi
          python scripts/studio_check.py --exe "$EXE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: pebp_demo/dist/PEBP-Studio-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum PEBP-Studio-*.zip | tee SHA256SUMS.txt
      - name: Check the tag matches the code's version
        run: |
          v=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('pebp_demo/pebp/__init__.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but code is $v"; exit 1; }
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          name: PEBP Studio ${{ github.ref_name }} (research use only)
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/PEBP-Studio-*.zip
            dist/SHA256SUMS.txt
